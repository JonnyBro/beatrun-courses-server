<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Courses database for Beatrun - browse, play and compete on community-made courses."
		/>
		<title>Beatrun Courses</title>
		<!-- Apply the saved theme before the app loads to avoid a flash, keep in sync with src/lib/theme.ts -->
		<script>
			(function () {
				var themes = { beatrun: 1, "courses-dark": 1, "courses-light": 0, purist: 0, infection: 1 };
				var theme = "beatrun";
				try {
					var saved = localStorage.getItem("br-theme");
					if (saved && saved in themes) theme = saved;
				} catch (e) {}
				document.documentElement.dataset.theme = theme;
				if (themes[theme]) document.documentElement.classList.add("dark");
			})();
		</script>
	</head>

	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
